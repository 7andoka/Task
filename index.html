<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#006B62" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- iOS support -->
    <link rel="apple-touch-icon" href="https://i.postimg.cc/1XRRDjGB/1643207840139.jpg" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Splash Screen for iOS -->
    <link rel="apple-touch-startup-image" href="/background.jpg" />
    
    <!-- Windows support -->
    <meta name="msapplication-TileColor" content="#006B62" />

    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/1XRRDjGB/1643207840139.jpg" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('app_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
