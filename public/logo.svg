<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%" fill="none">
  <!-- Group with interlocking leaves to form the organic circle emblem -->
  <g id="logo-emblem" transform="translate(10, 10)">
    <!-- Deep Teal Bottom/Left interlocking organic leaf -->
    <path d="M 50,100 C 22,100 0,78 0,50 C 0,38 4,27 11,18 C 12,23 13,30 16,36 C 22,46 32,54 44,57 C 50,58 54,62 55,67 C 57,75 54,82 50,88 C 47,92 48,96 52,98 C 55,100 52,100 50,100 Z" fill="#0E5F59"/>
    <!-- Lime Green Top/Right interlocking organic leaf -->
    <path d="M 50,0 C 78,0 100,22 100,50 C 100,62 96,73 89,82 C 88,77 87,70 84,64 C 78,54 68,46 56,43 C 50,42 46,38 45,33 C 43,25 46,18 50,12 C 53,8 52,4 48,2 C 45,0 48,0 50,0 Z" fill="#98C21E"/>
    <!-- Left Inner Accent Leaf (Teal) -->
    <path d="M 45,67 C 36,60 28,48 24,35 C 33,45 42,52 48,60 C 52,65 54,71 52,78 C 50,71 48,68 45,67 Z" fill="#0E5F59"/>
    <!-- Right Inner Accent Leaf (Lime) -->
    <path d="M 55,33 C 64,40 72,52 76,65 C 67,55 58,48 52,40 C 48,35 46,29 48,22 C 50,29 52,32 55,33 Z" fill="#98C21E"/>
  </g>
  <g id="logo-text" transform="translate(135, 75)">
    <!-- Brand Name text in premium serif font with exact colors -->
    <text font-family="'Lora', 'Georgia', 'Times New Roman', serif" font-weight="900" font-size="44" fill="#0E5F59" letter-spacing="-0.5">Rich Land</text>
    <!-- Food Industries subtext with wide modern tracking -->
    <text y="24" font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="11" fill="#0E5F59" letter-spacing="5">FOOD INDUSTRIES</text>
  </g>
</svg>
